<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check List</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>

    <div id="error-msg"></div>

    <div id="modal-overlay">
        <div id="modal-box">
            <h3>Editar Tarea</h3>

            <label>Descripción</label>
            <input id="modal-desc" type="text">

            <label>Fecha</label>
            <input id="modal-fecha" type="date">

            <div id="modal-botones">
                <button id="modal-cancelar">Cancelar</button>
                <button id="modal-guardar">Guardar</button>
            </div>
        </div>
    </div>

    <div class="container">

        <h1>CHECK LIST</h1>

        <div class="cont1">
            <h2>Nueva Tarea</h2>
            <div class="entrada-datos">
                <div class="campo">
                    <label>Descripción</label>
                    <input
                        type="text"
                        id="descripcion"
                        class="ent-dat"
                        placeholder="Ej: Estudiar React"
                    >
                </div>
                <div class="campo">
                    <label>Fecha</label>
                    <input type="date" id="fecha" class="ent-dat">
                </div>
                <button class="btn-primario" onclick="agregarTarea()">Guardar</button>
            </div>
        </div>

        <div class="cont2">
            <h2 class="titulo">TODO LIST</h2>
            <div class="header">
                <div class="col">Descripción</div>
                <div class="col">Fecha</div>
                <div class="col">Estado</div>
                <div class="col">Acciones</div>
            </div>
            <div id="lista"></div>
        </div>

    </div>

    <script src="/js/script.js"></script>

</body>
</html>
